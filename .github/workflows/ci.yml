name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storefront:
    name: Storefront (root)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://carrier-midea-red-sea.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  admin-panel:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      - run: npm test
