name: Deploy Supabase

# Manual-trigger only, deliberately: this pushes database migrations and
# deploys Edge Functions to the live project, which is a meaningfully
# riskier action than redeploying a static site, so it keeps a human
# decision point before every run rather than firing on every merge.
#
# Requires two repository secrets before this will work:
#   SUPABASE_ACCESS_TOKEN — a personal/service access token from
#     https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF  — this project's ref id (found in
#     Project Settings > General, or in the project's dashboard URL)
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Push migrations and deploy Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy manage-staff-users
          supabase functions deploy paymob-webhook
          supabase functions deploy create-payment-intent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
